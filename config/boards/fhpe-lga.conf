# Rockchip Generic Board
BOARD_NAME="Fast HW Perf Emu Board"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="Sergey Kharenko"
BOOTCONFIG="fhpe-lga_defconfig" # vendor name, not standard, see hook below, set BOOT_SOC below to compensate
BOOT_SOC="rk3568"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
# BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-fhpe-lga.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"
BOOTFS_TYPE="fat"

VENDOR="FHPE"
VENDORURL="https://www.hust.edu.cn/"
VENDORSUPPORT="https://github.com/SergeyKharenko"

function late_family_config__fhpe-lga_change_to_private_config() {
	display_alert "$BOARD" "Change to use linux-rk35xx-vendor-npan-ncsf.conf" "info"
	
	BOOTSOURCE='https://github.com/SergeyKharenko/u-boot.git'
	BOOTBRANCH='branch:sk-series'
	KERNELSOURCE='https://github.com/SergeyKharenko/linux-rockchip.git'
	KERNELBRANCH='branch:sk-series'
	LINUXCONFIG="linux-rk35xx-vendor-npan-ncsf"
	return 0
}

function post_family_tweaks__fhpe-lga_install_custom_packs() {
	display_alert "$BOARD" "Installing Custom Favor Packs" "info"
    # Core development toolchain & build utilities
    chroot_sdcard_apt_get_install \
        wget git curl meson \
        g++ gdb clang \
		gdbserver \
        build-essential \
        cmake cmake-gui ninja-build ccache \
        pkg-config \
        libc6-dev libstdc++-12-dev
}

function pre_config_uboot_target__sk-ifdk-slim_patch_rockchip_common_boot_order() {
	declare -a rockchip_uboot_targets=("mmc0" "scsi" "nvme") # for future make-this-generic delight
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: adjust boot order to '${rockchip_uboot_targets[*]}'" "info"
	sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${rockchip_uboot_targets[*]}\"/" include/configs/rockchip-common.h
	regular_git diff -u include/configs/rockchip-common.h || true
}

# Include fw_setenv, configured to point to the correct spot on the SPI Flash
PACKAGE_LIST_BOARD="libubootenv-tool" # libubootenv-tool provides fw_printenv and fw_setenv, for talking to U-Boot environment
